services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./backend:/app/backend
      - ./edge_ai:/app/edge_ai
      - ./speech:/app/speech
      - ./nlp:/app/nlp
      - ./sign-repository:/app/sign-repository

    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload